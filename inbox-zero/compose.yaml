# Inbox Zero, run as a Home Assistant add-on.
#
# Mirrors the official self-host stack (ghcr.io/elie222/inbox-zero web + worker,
# plus an embedded Postgres, Redis and the Upstash-compatible Redis HTTP bridge)
# but keeps all persistent data on the add-on's /data volume (via ${DATA_DIR}
# bind mounts) so it is included in normal Home Assistant add-on backups.
#
# Variables are provided by the .env file generated by run.sh.

x-web-env: &web-env
  NODE_ENV: production
  NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
  NEXT_PUBLIC_BYPASS_PREMIUM_CHECKS: ${NEXT_PUBLIC_BYPASS_PREMIUM_CHECKS}
  NEXT_PUBLIC_EMAIL_SEND_ENABLED: "true"
  NEXT_PUBLIC_AI_MODEL_SETTINGS_DISABLED: "false"

  DATABASE_URL: ${DATABASE_URL}
  DIRECT_URL: ${DIRECT_URL}

  UPSTASH_REDIS_URL: http://serverless-redis-http:80
  UPSTASH_REDIS_TOKEN: ${UPSTASH_REDIS_TOKEN}
  REDIS_URL: redis://redis:6379
  QUEUE_BACKEND: bullmq

  INTERNAL_API_URL: http://web:3000
  INTERNAL_API_KEY: ${INTERNAL_API_KEY}
  API_KEY_SALT: ${API_KEY_SALT}
  CRON_SECRET: ${CRON_SECRET}

  AUTH_SECRET: ${AUTH_SECRET}
  EMAIL_ENCRYPT_SECRET: ${EMAIL_ENCRYPT_SECRET}
  EMAIL_ENCRYPT_SALT: ${EMAIL_ENCRYPT_SALT}
  AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS}

  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  GOOGLE_PUBSUB_TOPIC_NAME: ${GOOGLE_PUBSUB_TOPIC_NAME}
  GOOGLE_PUBSUB_VERIFICATION_TOKEN: ${GOOGLE_PUBSUB_VERIFICATION_TOKEN}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
  MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID}
  MICROSOFT_WEBHOOK_CLIENT_STATE: ${MICROSOFT_WEBHOOK_CLIENT_STATE}

  DEFAULT_LLMS: ${DEFAULT_LLMS}
  ECONOMY_LLMS: ${ECONOMY_LLMS}
  CHAT_LLMS: ${CHAT_LLMS}
  NANO_LLMS: ${NANO_LLMS}
  DRAFT_LLMS: ${DRAFT_LLMS}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: inboxzero
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/redis:/data

  serverless-redis-http:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${UPSTASH_REDIS_TOKEN}
      SRH_CONNECTION_STRING: "redis://redis:6379"

  web:
    image: ghcr.io/elie222/inbox-zero:${APP_RELEASE}
    restart: unless-stopped
    environment: *web-env
    env_file:
      - /data/extra.env
    ports:
      - ${HTTP_PORT}:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      serverless-redis-http:
        condition: service_started

  worker:
    image: ghcr.io/elie222/inbox-zero:${APP_RELEASE}
    command: ["/app/docker/scripts/start-worker.sh"]
    restart: unless-stopped
    environment: *web-env
    env_file:
      - /data/extra.env
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_started

  cron:
    image: alpine:latest
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
    command: >
      sh -c '
      apk add --no-cache curl;
      run() { while true; do curl -s -X GET "$$1" -H "Authorization: Bearer $$CRON_SECRET" || true; sleep "$$2"; done; };
      run "http://web:3000/api/cron/scheduled-actions" 900 &
      run "http://web:3000/api/cron/automation-jobs" 900 &
      run "http://web:3000/api/follow-up-reminders" 3600 &
      run "http://web:3000/api/resend/digest/all" 1800 &
      run "http://web:3000/api/meeting-briefs" 900 &
      run "http://web:3000/api/meeting-recorder/schedule" 300 &
      run "http://web:3000/api/watch/all" 21600 &
      wait
      '
    depends_on:
      - web
